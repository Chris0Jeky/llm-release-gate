name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build distribution archives
        run: |
          python -m pip install build
          python -m build --outdir dist
      - name: Verify notices and fresh offline wheel install
        run: python scripts/verify_dist.py dist --smoke
      - uses: actions/upload-artifact@v6
        with:
          name: release-packages
          path: dist/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: make install PY=python
      - name: Tests + green/red demos
        run: make ci PY=python
      - name: Upload demo reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: demo-reports-${{ matrix.python-version }}
          path: out/

  action-self-test:
    # Exercises action.yml itself: the green example must pass the step,
    # the red example must fail it (checked via continue-on-error + outcome).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Gate a safe change (must pass)
        id: green
        uses: ./
        with:
          dataset: examples/rag-support-bot/dataset.json
          baseline: examples/rag-support-bot/baseline.json
          candidate: examples/rag-support-bot/candidate.json
          scorers: examples/rag-support-bot/scorers.json
          thresholds: examples/rag-support-bot/thresholds.json
          pricing: examples/pricing.json
          out: out/action-green
          max-input-bytes: "1048576"
          comment: "false"

      - name: Gate the deliberate regression (must fail)
        id: red
        continue-on-error: true
        uses: ./
        with:
          dataset: examples/assistant-cheap-regression/dataset.json
          baseline: examples/assistant-cheap-regression/baseline.json
          candidate: examples/assistant-cheap-regression/candidate.json
          scorers: examples/assistant-cheap-regression/scorers.json
          thresholds: examples/assistant-cheap-regression/thresholds.json
          pricing: examples/pricing.json
          out: out/action-red
          comment: "false"

      - name: Reject an oversized input (must not produce a verdict)
        id: oversize
        continue-on-error: true
        uses: ./
        with:
          dataset: examples/rag-support-bot/dataset.json
          baseline: examples/rag-support-bot/baseline.json
          candidate: examples/rag-support-bot/candidate.json
          scorers: examples/rag-support-bot/scorers.json
          thresholds: examples/rag-support-bot/thresholds.json
          out: out/action-oversize
          max-input-bytes: "1"
          comment: "false"

      - name: Gate synthetic request-bound replay (must pass)
        id: bound
        uses: ./
        with:
          dataset: examples/request-bound-replay/dataset.json
          baseline: examples/request-bound-replay/baseline.json
          candidate: examples/request-bound-replay/candidate.json
          scorers: examples/request-bound-replay/scorers.json
          thresholds: examples/request-bound-replay/thresholds.json
          out: out/action-bound
          require-request-binding: "true"
          max-input-bytes: "1048576"
          comment: "false"

      - name: Refuse unbound configs under binding policy
        id: unbound
        continue-on-error: true
        uses: ./
        with:
          dataset: examples/rag-support-bot/dataset.json
          baseline: examples/rag-support-bot/baseline.json
          candidate: examples/rag-support-bot/candidate.json
          scorers: examples/rag-support-bot/scorers.json
          thresholds: examples/rag-support-bot/thresholds.json
          out: out/action-unbound
          require-request-binding: "true"
          comment: "false"

      - name: Assert outcomes
        run: |
          test "${{ steps.green.outputs.verdict }}" = "pass"
          test "${{ steps.red.outcome }}" = "failure"
          test "${{ steps.red.outputs.verdict }}" = "fail"
          test "${{ steps.oversize.outcome }}" = "failure"
          test -z "${{ steps.oversize.outputs.verdict }}"
          test -z "${{ steps.oversize.outputs.report-json }}"
          test ! -e out/action-oversize/report.json
          test "${{ steps.bound.outputs.verdict }}" = "pass"
          test "${{ steps.unbound.outcome }}" = "failure"
          test -z "${{ steps.unbound.outputs.verdict }}"
          test -z "${{ steps.unbound.outputs.report-json }}"
          test ! -e out/action-unbound/report.json
          echo "action self-test OK: green/bound passed; red, oversized and unbound inputs blocked"

  report-reproducibility:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-reports-3.11
          path: reports-3.11
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-reports-3.13
          path: reports-3.13
          digest-mismatch: error
      - name: Compare deterministic report bytes across Python versions
        shell: bash
        run: |
          set -euo pipefail
          for example in rag-support-bot extraction-api assistant-cheap-regression request-bound-replay; do
            for format in json md html; do
              cmp "reports-3.11/$example/report.$format" "reports-3.13/$example/report.$format"
            done
          done
          cmp "reports-3.11/request-bound-replay/plan.json" "reports-3.13/request-bound-replay/plan.json"
          cmp "reports-3.11/request-bound-replay/binding-check.json" "reports-3.13/request-bound-replay/binding-check.json"
          echo "All twelve reports, request plan and binding receipt are byte-identical across Python 3.11 and 3.13"
